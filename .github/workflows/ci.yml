name: Resguardo CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    # Playwright 1.57 supports Ubuntu 24.04; GitHub's ubuntu-latest is 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit checks and production build
        run: npm run check
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end QA
        run: npm run qa:e2e
